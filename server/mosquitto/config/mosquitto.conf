persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Everyone must log in, and may only use the topics allowed in aclfile
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/aclfile

# Internal listener (Docker network only, used by Node-RED)
listener 1883

# Public TLS listener (used by the Thingy:91 X)
listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
